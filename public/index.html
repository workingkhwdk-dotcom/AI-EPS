<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#06226B" />
<title>AI-EPS: 확장된 경험 기반 문제해결학습 모형</title>
<link rel="icon" type="image/webp" href="knue-mark.webp" />
<!-- 휴대폰이면 모바일 전용 화면(m.html)으로 옮긴다 -->
<script src="device.js" data-mobile="m.html"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang&display=swap" rel="stylesheet">
<!-- 글꼴: Pretendard(본문), 고운바탕(편지) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<a class="skip" href="#main">본문으로 건너뛰기</a>
<header class="hdr"><div class="hdr-in">
  <div class="brand"><img class="mark" src="knue-mark.webp" srcset="knue-mark.webp 1x, knue-mark@2x.webp 2x" width="40" height="40" alt="한국교원대학교 마크" fetchpriority="high" decoding="async" /><div class="brand-t"><span class="logo">AI-EPS</span><span class="model">확장된 경험 기반 문제해결학습 모형</span><small>한국교원대학교<span class="tot"> · Teacher of Teachers</span></small></div></div>
  <div class="hdr-right"><span class="net hidden" id="net" role="status" aria-live="polite"></span><span class="who" id="who"></span><button class="btn-out hidden" id="logout" type="button">로그아웃</button></div>
</div></header>

<main class="wrap" id="main">
  <section id="join" class="card">
    <h2>수업 입장</h2>
    <p class="desc">선생님이 알려 준 수업 코드와 모둠 번호를 입력하세요. 이름 대신 별명을 사용하고, 개인정보는 쓰지 않습니다.</p>
    <label class="lbl" for="j-code">수업 코드</label>
    <input type="text" id="j-code" maxlength="6" autocapitalize="characters" autocomplete="off" />
    <label class="lbl" for="j-group">모둠 번호</label>
    <input type="number" id="j-group" min="1" max="12" inputmode="numeric" />
    <label class="lbl" for="j-nick">별명</label>
    <input type="text" id="j-nick" maxlength="12" autocomplete="off" />
    <label class="lbl" for="j-pw">비밀번호</label>
    <input type="password" id="j-pw" maxlength="40" autocomplete="off" placeholder="4자 이상" />
    <p class="meta-line" style="margin:6px 0 0">처음이라면 지금 정한 비밀번호가 내 비밀번호가 됩니다. 다시 들어올 때 같은 별명과 비밀번호를 쓰면 하던 것이 이어집니다. 비밀번호를 잊으면 선생님께 알려 주세요.</p>
    <div style="margin-top:16px"><button class="btn btn-primary" id="j-btn">입장하기</button></div>
    <p class="meta-line" style="margin:12px 0 0">함께 쓰는 컴퓨터라면 끝낼 때 꼭 <b>로그아웃</b>을 누르세요.</p>
  </section>

  <!-- 대기실: 선생님이 수업을 시작하기 전에 보여 주는 화면 -->
  <section id="wait" class="hidden"></section>

  <section id="app" class="hidden">
    <div class="stages" id="tabs"></div>
    <div id="panel"></div>
  </section>
  <p class="m-switch hidden" id="to-mobile"><a href="m.html?view=m">모바일 화면으로 보기</a></p>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
