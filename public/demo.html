<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#06226B" />
<meta name="color-scheme" content="light" />
<title>AI-EPS 체험하기</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/student-32.png" />
<link rel="shortcut icon" href="icons/student.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="icons/student-180.png" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="demo/demo.css" />
</head>
<body class="demo-menu">
<!-- 체험하기: 수업이 열려 있다고 보고, 혼자서 주제 하나를 골라 학생 화면을 직접 해 본다. 저장은 이 기기에만 한다. -->
<header class="hdr"><div class="hdr-in">
  <div class="brand"><img class="mark" src="knue-mark.webp" srcset="knue-mark.webp 1x, knue-mark@2x.webp 2x" width="40" height="40" alt="한국교원대학교 마크" decoding="async" /><div class="brand-t"><span class="logo">AI-EPS<em style="font-style:normal;font-weight:800;font-size:11px;margin-left:6px;padding:1px 7px;border-radius:20px;background:rgba(255,255,255,0.2)">체험</em></span><small>한국교원대학교</small></div></div>
</div></header>
<main class="demo-wrap" id="main">
  <section class="demo-hero">
    <h1>주제 하나를 골라, 학생이 되어 가상 수업을 해 보세요</h1>
    <ol class="demo-steps" aria-label="체험 순서"><li><b>1</b>주제 고르기</li><li><b>2</b>학생 화면으로 1~7단계</li><li><b>3</b>홈에서 다른 주제도</li></ol>
    <!-- 학교급: 같은 주제라도 중학교·고등학교 수업의 말 수준과 활동 구조가 다르다. 학교급마다 저장이 따로다. -->
    <div class="demo-level"><span class="dl-k">어느 학교 수업으로 해 볼까요?</span>
      <div class="seg" id="level" role="radiogroup" aria-label="학교급"><button type="button" role="radio" data-lv="high">고등학교</button><button type="button" role="radio" data-lv="middle">중학교</button></div>
      <p class="dl-note" id="level-note"></p></div>
    <button class="link demo-about" type="button" id="about">체험과 실제 수업은 무엇이 다른가요?</button>
  </section>
  <div class="topics-head"><b id="topics-count">서로 독립된 주제</b><span>하나만 골라도 처음부터 끝까지 체험할 수 있어요</span></div>
  <div class="topics" id="topics" aria-live="polite"><div class="meta-line" style="text-align:center">불러오는 중…</div></div>
  <p class="demo-foot">주제 화면 위쪽의 <b>홈</b>을 누르면 이 화면으로 돌아오고, <b>초기화</b>를 누르면 그 주제를 처음부터 다시 할 수 있어요.</p>
</main>
<script type="module">
import { hasProgress, resetTopic } from "./demo/store.js";
import { showModal } from "./modal.js";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const box = document.getElementById("topics");
// 고른 학교급은 이 기기에 기억한다(다음에 열어도 그대로)
const LV = "eps_demo_level";
const LEVEL_NOTE = {
  high: "고등학교: 인물의 틀린 믿음이 그럴듯하게 섞여 있고, 원인끼리 잇기·자료 두 번 확인·해결책 견주기 같은 심화 활동까지 해요.",
  middle: "중학교: AI가 더 짧고 쉬운 말로 답하고, 사실·의견 가르기, 판정 3가지, 해결책 점검, 1년 뒤 미래처럼 한 걸음씩 단순하게 해요.",
};
let level = "high"; try { level = localStorage.getItem(LV) === "middle" ? "middle" : "high"; } catch {}
const lvq = () => (level === "middle" ? "&lv=middle" : "");
function drawLevel() {
  document.querySelectorAll("#level [data-lv]").forEach((b) => { const on = b.dataset.lv === level; b.classList.toggle("on", on); b.setAttribute("aria-checked", String(on)); });
  document.getElementById("level-note").textContent = LEVEL_NOTE[level];
}
document.getElementById("level").onclick = (e) => {
  const b = e.target.closest("[data-lv]"); if (!b) return;
  level = b.dataset.lv; try { localStorage.setItem(LV, level); } catch {}
  drawLevel(); draw(topics);
};
drawLevel();
// 제목 끝의 (연도)는 따로 떼어 작은 줄로 보여 준다
const split = (t) => { const m = /\s*\(([^)]+)\)\s*$/.exec(t); return m ? [t.slice(0, m.index), m[1]] : [t, ""]; };
function draw(topics) {
  box.innerHTML = topics.map((t, i) => {
    const saved = hasProgress(t.id, level), [title, when] = split(t.title);
    return `<article class="topic ${saved ? "has-saved" : ""}"><div class="t-no" aria-hidden="true">${i + 1}</div>
      <div class="t-main"><div class="t-k">주제 ${i + 1}${when ? ` · ${esc(when)}` : ""}</div><h2>${esc(title)}</h2>
      <p class="sum">${esc(t.summary)}</p>
      <div class="who">만날 인물 ${t.personas}명: ${esc((t.stakeholders || []).join(" · "))}</div>
      ${saved ? `<div class="saved">✓ 하던 것이 저장돼 있어요</div>` : ""}</div>
      <div class="acts"><a class="btn btn-primary" href="demo-play.html?t=${esc(t.id)}${lvq()}" aria-label="${esc(title)} ${level === "middle" ? "중학교" : "고등학교"} 체험${saved ? " 이어서 하기" : " 시작"}">${saved ? "이어서 하기" : "이 주제로 체험"} →</a>
      ${saved ? `<button class="btn btn-plain" type="button" data-reset="${esc(t.id)}" data-title="${esc(t.title)}">처음부터</button>` : ""}</div></article>`;
  }).join("");
}
let topics = [];
fetch("demo/topics.json").then((r) => r.json()).then((t) => { topics = t; document.getElementById("topics-count").textContent = `서로 독립된 주제 ${t.length}개`; draw(t); })
  .catch(() => { box.innerHTML = `<div class="notice">주제 목록을 불러오지 못했어요. 인터넷 연결을 확인하고 다시 열어 주세요.</div>`; });
box.addEventListener("click", (e) => {
  // 카드의 빈 곳(제목·설명)을 눌러도 그 주제의 체험을 연다
  const card = e.target.closest(".topic");
  if (card && !e.target.closest("a, button")) { location.href = card.querySelector("a.btn-primary").href; return; }
  const b = e.target.closest("[data-reset]"); if (!b) return;
  if (!confirm(`'${b.dataset.title}' 체험을 처음부터 다시 할까요?\n\n지금까지 쓴 글과 대화가 모두 지워져요.`)) return;
  resetTopic(b.dataset.reset, level); draw(topics);
});
// 체험이 무엇인지: 처음 들어오면 한 번 띄우고, 위쪽 링크로 언제든 다시 본다
const ABOUT = "eps_demo_about";
const about = () => showModal({ title: "체험하기는 이런 거예요", dismissible: true, cls: "about-pop",
  body: `<div class="about-row"><span class="about-k">실제 수업</span><p>선생님이 <b>교사 계정으로 수업방</b>을 만들면, 학생은 그 <b>수업 코드로 입장</b>해 모둠 친구들과 함께 1~7단계를 해요.</p></div>
    <div class="about-row"><span class="about-k k-demo">체험</span><p>수업방·코드 같은 준비 없이, <b>주제 하나를 골라</b> 그 주제의 수업이 1~7단계로 어떻게 흘러가는지 <b>혼자 한 번에</b> 해 봐요. 화면과 활동 순서는 실제 수업과 같아요.</p></div>
    <div class="about-row"><span class="about-k k-diff">다른 점</span><ul>
      <li><b>AI 품질:</b> 체험은 가벼운 체험용 AI가 답해요. 실제 수업은 <b>더 고성능 AI</b>라 인물의 대답과 AI 도우미의 답이 더 깊고 정확해요.</li>
      <li>인물에게 묻기 5번 · AI 도우미 5번까지(주제마다). 다 쓰면 준비된 예시 답이 나와요.</li>
      <li>모둠 친구·선생님 없이 혼자 하고, 쓴 글은 이 기기에만 저장돼요.</li></ul></div>
    <p class="meta-line" style="margin-top:10px">단계마다 실제 수업과 다른 점은 그 단계에 들어갈 때 안내 창에서 알려 드려요.</p>`,
  actions: [{ label: "주제 고르러 가기", value: true, kind: "btn-primary" }] });
document.getElementById("about").onclick = about;
let seen = false; try { seen = localStorage.getItem(ABOUT) === "1"; } catch {}
if (!seen) { try { localStorage.setItem(ABOUT, "1"); } catch {} about(); }
</script>
</body>
</html>
