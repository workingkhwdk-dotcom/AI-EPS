<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#06226B" />
<meta name="color-scheme" content="light" />
<title>AI-EPS 체험하기</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/student-32.png" />
<link rel="shortcut icon" href="icons/student.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="icons/student-180.png" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="demo/demo.css" />
</head>
<body class="demo-menu">
<!-- 체험하기: 수업이 열려 있다고 보고, 혼자서 주제 하나를 골라 학생 화면을 직접 해 본다. 저장은 이 기기에만 한다. -->
<header class="hdr"><div class="hdr-in">
  <div class="brand"><img class="mark" src="knue-mark.webp" srcset="knue-mark.webp 1x, knue-mark@2x.webp 2x" width="40" height="40" alt="한국교원대학교 마크" decoding="async" /><div class="brand-t"><span class="logo">AI-EPS<em style="font-style:normal;font-weight:800;font-size:11px;margin-left:6px;padding:1px 7px;border-radius:20px;background:rgba(255,255,255,0.2)">체험</em></span><small>한국교원대학교</small></div></div>
</div></header>
<main class="demo-wrap" id="main">
  <div class="demo-hero">
    <h1>학생이 되어 체험해 보세요</h1>
    <p>수업이 열려 있다고 생각하고, 주제 하나를 골라 학생 화면을 처음부터 끝까지 혼자 해 볼 수 있어요. 쓴 글은 <b>이 기기에만</b> 저장돼요. 인물과 AI 도우미는 실제 수업과 같은 AI가 답하고, 체험에서는 <b>인물에게 묻기 5번 · AI 도우미 5번</b>까지(주제마다) 쓸 수 있어요. 다 쓰면 준비된 예시 답이 나와요.</p>
  </div>
  <div class="topics" id="topics" aria-live="polite"><div class="meta-line" style="text-align:center">불러오는 중…</div></div>
  <p class="demo-foot">주제 화면 위쪽의 <b>홈</b>을 누르면 이 화면으로 돌아오고, <b>초기화</b>를 누르면 그 주제를 처음부터 다시 할 수 있어요.</p>
</main>
<script type="module">
import { hasProgress, resetTopic } from "./demo/store.js";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const box = document.getElementById("topics");
function draw(topics) {
  box.innerHTML = topics.map((t) => {
    const saved = hasProgress(t.id);
    return `<article class="topic"><h2>${esc(t.title)}</h2>
      <p class="sum">${esc(t.summary)}</p>
      <div class="who">등장하는 사람들: ${esc((t.stakeholders || []).join(" · "))} · 인물 ${t.personas}명</div>
      ${saved ? `<div class="saved">✓ 하던 것이 저장돼 있어요</div>` : ""}
      <div class="acts"><a class="btn btn-primary" href="demo-play.html?t=${esc(t.id)}">${saved ? "이어서 하기" : "체험 시작"}</a>
      ${saved ? `<button class="btn btn-plain" type="button" data-reset="${esc(t.id)}" data-title="${esc(t.title)}">처음부터</button>` : ""}</div></article>`;
  }).join("");
}
let topics = [];
fetch("demo/topics.json").then((r) => r.json()).then((t) => { topics = t; draw(t); })
  .catch(() => { box.innerHTML = `<div class="notice">주제 목록을 불러오지 못했어요. 인터넷 연결을 확인하고 다시 열어 주세요.</div>`; });
box.addEventListener("click", (e) => {
  const b = e.target.closest("[data-reset]"); if (!b) return;
  if (!confirm(`'${b.dataset.title}' 체험을 처음부터 다시 할까요?\n\n지금까지 쓴 글과 대화가 모두 지워져요.`)) return;
  resetTopic(b.dataset.reset); draw(topics);
});
</script>
</body>
</html>
