<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>AI-EPS 교사용</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="hdr"><div class="hdr-in"><span class="logo">AI-EPS 교사용</span><span class="meta-line" id="who"></span></div></header>
<main class="wrap">
  <section id="login" class="card">
    <h2>교사 로그인</h2>
    <p class="desc">허용된 교사 계정(구글)으로 로그인하세요.</p>
    <button class="btn btn-primary" id="login-btn">구글로 로그인</button>
  </section>

  <section id="main" class="hidden">
    <div class="card">
      <h2>새 수업 만들기</h2>
      <label class="lbl" for="t-event">사건</label>
      <select id="t-event"><option value="jeju2018">제주 예멘 난민 신청 논란 (2018)</option></select>
      <label class="lbl" for="t-title">수업 이름</label><input type="text" id="t-title" value="제주 예멘 난민 사건, 갈등 해결 방안 제안하기" />
      <label class="lbl" for="t-groups">모둠 수 (최대 12)</label><input type="number" id="t-groups" value="6" min="1" max="12" />
      <div style="margin-top:14px"><button class="btn btn-primary" id="create-btn">수업 만들기</button></div>
    </div>
    <div class="card">
      <h2>인물·출처 점검</h2>
      <p class="desc">페르소나는 아래 출처의 보도 내용에만 근거합니다. <b>수업 전에 원문 링크를 열어 확인</b>하고, 확인한 출처는 <code>functions/case.js</code>에서 <code>verified</code>를 true로 바꿔 배포하세요. 확인 전 인물은 학생에게 보이지 않습니다.</p>
      <div class="chipbar" id="ev-chips"></div>
      <div id="persona-check" style="margin-top:12px"></div>
    </div>
    <div class="card"><h2>내 수업</h2><div id="sessions" class="group"></div></div>
    <div id="monitor" class="hidden">
      <div class="card">
        <div class="row" style="justify-content:space-between"><h2 id="m-title" style="margin:0"></h2><button class="btn btn-tinted btn-sm" id="csv-btn">로그 CSV 내려받기</button></div>
        <p class="desc" id="m-code"></p>
        <div id="groups"></div>
      </div>
      <div class="card" id="log-card"><h3 id="log-title">AI 사용 로그</h3><div id="logs"></div></div>
    </div>
  </section>
</main>
<script type="module" src="teacher.js"></script>
</body>
</html>
